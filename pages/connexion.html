<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/src/assets/css/header.css" />
  <link rel="stylesheet" href="/src/assets/css/footer.css" />
  <link rel="stylesheet" href="/src/assets/css/connexion.css" />

  <!-- Vue -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app">
    <header-component></header-component>

    <main class="connexion-page">
      <form class="connexion-form" @submit.prevent="connexion">
        <h2 class="connexion-title">Connexion</h2>

        <p v-if="messageErreur" class="connexion-error">{{ messageErreur }}</p>

        <label for="email" class="connexion-label">E-mail :</label>
        <input type="email" id="email" v-model="email" class="connexion-input" required />

        <label for="motdepasse" class="connexion-label">Mot de passe :</label>
        <input type="password" id="motdepasse" v-model="motDePasse" class="connexion-input" required />

        <div class="connexion-checkbox">
          <input type="checkbox" id="resterconnecte" name="resterconnecte" />
          <label for="resterconnecte">Rester connecté</label>
        </div>

        <button type="submit" class="connexion-button">Se connecter</button>

        <p class="connexion-link">Pas de compte ? <a href="inscription.html">S'inscrire</a></p>
      </form>
    </main>

    <footer-component></footer-component>
  </div>
</body>
</html>
