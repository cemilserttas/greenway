<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Covoiturage</title>
  <link rel="stylesheet" href="/src/assets/css/contact.css">
</head>
<body>
  <div class="contact-wrapper">
    <div class="contact-image">
        <img src="/src/assets/img/voiture.png" alt="Image de voiture">

    </div>
    <div class="contact-form">
      <h1>Contactez-nous</h1>
      <form id="contactForm">
        <input type="text" name="name" placeholder="Votre nom" required>
        <input type="email" name="email" placeholder="Votre e-mail" required>
        <textarea name="message" placeholder="Votre message" rows="6" required></textarea>
        <button type="submit">Envoyer</button>
        <p id="feedback"></p>
      </form>
    </div>
  </div>

  <script src="src/components/contact.js"></script>
</body>
</html>
